<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ホラー演出のメインコンテナ -->
  <div id="jumpscare-container" class="active">
    <div id="strobe-overlay"></div>
    <div id="vignette"></div>
    <div id="glitch-overlay"></div>
    
    <!-- ホラー画像表示エリア -->
    <div id="image-wrapper" class="shake-extreme">
      <img id="scare-image" src="assets/jumpscareImage.jpg" alt="scare">
    </div>

    <!-- 不気味なメッセージ（非表示またはフラッシュ表示可能） -->
    <div id="scare-text"></div>
  </div>

  <!-- 参考元の音声ファイル（即時自動再生） -->
  <audio id="scare-audio" preload="auto" loop>
    <source src="assets/jumpscareSound.mp3" type="audio/mpeg">
    <source src="assets/scream.mp3" type="audio/mpeg">
  </audio>

  <!-- 音声自動再生ブロック解除用の透明全面タップオーバーレイ -->
  <div id="click-trigger" title="Tap anywhere"></div>

  <script src="script.js"></script>
</body>
</html>

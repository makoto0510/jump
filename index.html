<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>...</title>
  <link rel="stylesheet" href="./style.css?v=5">
</head>
<body>
  <!-- タップ待ち画面（ボタンなし・全画面黒） -->
  <div id="trap-screen"></div>

  <!-- ホラー演出コンテナ（発動時に全画面表示） -->
  <div id="jumpscare-container" style="display: none;">
    <div id="image-wrapper">
      <img id="scare-image" src="./assets/jumpscareImage.jpg?v=5" alt="Jumpscare">
    </div>
  </div>

  <!-- 参考元の叫び声音声 -->
  <audio id="scare-audio" preload="auto" loop>
    <source src="./assets/jumpscareSound.mp3?v=5" type="audio/mpeg">
  </audio>

  <script src="./script.js?v=5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Surprise</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <!-- ホラー演出コンテナ -->
  <div id="jumpscare-container">
    <div id="image-wrapper">
      <img id="scare-image" src="./assets/jumpscareImage.jpg?v=3" alt="Jumpscare">
    </div>
  </div>

  <!-- 参考元（heartstopper）の叫び声音声 -->
  <audio id="scare-audio" preload="auto" loop>
    <source src="./assets/jumpscareSound.mp3?v=3" type="audio/mpeg">
  </audio>

  <!-- 画面全体のクリック・タップ検知用透明レイヤー -->
  <div id="click-trigger"></div>

  <script src="./script.js?v=3"></script>
</body>
</html>

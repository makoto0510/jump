<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- 不気味な放射状グラデーション背景 -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#080000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- 青白く不健康な皮膚のグラデーション -->
    <radialGradient id="skin-grad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="35%" stop-color="#b0b5b3"/>
      <stop offset="70%" stop-color="#4a5250"/>
      <stop offset="100%" stop-color="#111615"/>
    </radialGradient>

    <!-- 眼窩の深い闇 -->
    <radialGradient id="eye-socket" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#2a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- 血走った眼球 -->
    <radialGradient id="eyeball" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd5d5"/>
      <stop offset="85%" stop-color="#aa2222"/>
      <stop offset="100%" stop-color="#330000"/>
    </radialGradient>

    <!-- ノイズフィルター -->
    <filter id="horror-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="1000" fill="url(#bg-grad)"/>

  <!-- 血の飛沫・背景ノイズ -->
  <g opacity="0.4">
    <circle cx="200" cy="150" r="80" fill="#660000" filter="url(#horror-filter)"/>
    <circle cx="820" cy="220" r="110" fill="#550000" filter="url(#horror-filter)"/>
    <circle cx="150" cy="800" r="140" fill="#440000" filter="url(#horror-filter)"/>
    <circle cx="850" cy="780" r="90" fill="#550000" filter="url(#horror-filter)"/>
  </g>

  <!-- 歪んだ頭部・顔 -->
  <g filter="url(#horror-filter)">
    <path d="M 500,80 
             C 750,80 880,240 850,520 
             C 830,730 680,940 500,960 
             C 320,940 170,730 150,520 
             C 120,240 250,80 500,80 Z" 
          fill="url(#skin-grad)"/>
  </g>

  <!-- 落ちくぼんだ眼窩（巨大な黒い窪み） -->
  <ellipse cx="330" cy="400" rx="140" ry="120" fill="url(#eye-socket)"/>
  <ellipse cx="670" cy="400" rx="140" ry="120" fill="url(#eye-socket)"/>

  <!-- 血走り・血管（左目） -->
  <g stroke="#aa0000" stroke-width="3" opacity="0.85">
    <path d="M 220,400 Q 280,390 310,400"/>
    <path d="M 240,360 Q 290,380 320,395"/>
    <path d="M 230,440 Q 280,420 315,405"/>
    <path d="M 430,370 Q 380,390 345,398"/>
    <path d="M 440,420 Q 380,410 340,402"/>
  </g>

  <!-- 血走り・血管（右目） -->
  <g stroke="#aa0000" stroke-width="3" opacity="0.85">
    <path d="M 780,400 Q 720,390 690,400"/>
    <path d="M 760,360 Q 710,380 680,395"/>
    <path d="M 770,440 Q 720,420 685,405"/>
    <path d="M 570,370 Q 620,390 655,398"/>
    <path d="M 560,420 Q 620,410 660,402"/>
  </g>

  <!-- 眼球（大きく見開かれた狂気の瞳） -->
  <!-- 左目 -->
  <circle cx="330" cy="400" r="65" fill="url(#eyeball)"/>
  <circle cx="330" cy="400" r="28" fill="#000000"/>
  <circle cx="320" cy="385" r="9" fill="#ffffff"/>
  <circle cx="338" cy="410" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- 右目 -->
  <circle cx="670" cy="400" r="65" fill="url(#eyeball)"/>
  <circle cx="670" cy="400" r="28" fill="#000000"/>
  <circle cx="660" cy="385" r="9" fill="#ffffff"/>
  <circle cx="678" cy="410" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- 鼻腔（黒く裂けた穴） -->
  <path d="M 480,520 Q 470,550 485,565 Q 495,570 495,550 Z" fill="#050000"/>
  <path d="M 520,520 Q 530,550 515,565 Q 505,570 505,550 Z" fill="#050000"/>

  <!-- 異常に裂けた口（巨大な黒い空洞） -->
  <path d="M 240,640 
           Q 500,600 760,640 
           Q 800,780 720,860 
           Q 500,930 280,860 
           Q 200,780 240,640 Z" 
        fill="#050000" stroke="#4a0000" stroke-width="12"/>

  <!-- 乱杭歯・鋭い牙（上歯） -->
  <g fill="#f4ebd9" stroke="#3d2f1f" stroke-width="2">
    <polygon points="280,635 295,675 310,637"/>
    <polygon points="315,635 330,685 345,636"/>
    <polygon points="355,633 375,695 395,635"/>
    <polygon points="405,630 425,700 445,632"/>
    <polygon points="460,628 480,705 500,628"/>
    <polygon points="505,628 525,705 545,628"/>
    <polygon points="560,630 580,700 600,632"/>
    <polygon points="610,633 630,695 650,635"/>
    <polygon points="660,635 675,685 690,636"/>
    <polygon points="700,635 715,675 730,637"/>
  </g>

  <!-- 乱杭歯・鋭い牙（下歯） -->
  <g fill="#f4ebd9" stroke="#3d2f1f" stroke-width="2">
    <polygon points="310,850 325,800 340,852"/>
    <polygon points="350,860 370,795 390,863"/>
    <polygon points="400,870 420,790 440,872"/>
    <polygon points="455,878 475,785 495,879"/>
    <polygon points="510,879 530,785 550,878"/>
    <polygon points="565,872 585,790 605,870"/>
    <polygon points="615,863 635,795 655,860"/>
    <polygon points="665,852 680,800 695,850"/>
  </g>

  <!-- 口から垂れる血滴 -->
  <g fill="#880000" opacity="0.9">
    <path d="M 330,685 C 330,740 335,745 335,750 A 6,6 0 1,1 323,750 C 323,745 328,740 328,685 Z"/>
    <path d="M 475,705 C 475,780 480,790 480,798 A 9,9 0 1,1 462,798 C 462,790 471,780 471,705 Z"/>
    <path d="M 630,695 C 630,750 635,760 635,768 A 7,7 0 1,1 621,768 C 621,760 626,750 626,695 Z"/>
  </g>

  <!-- 激しい引っ掻き傷・テクスチャ -->
  <g stroke="#000000" stroke-width="5" opacity="0.5">
    <line x1="180" y1="200" x2="350" y2="350"/>
    <line x1="210" y1="180" x2="380" y2="330"/>
    <line x1="820" y1="200" x2="650" y2="350"/>
    <line x1="790" y1="180" x2="620" y2="330"/>
  </g>
</svg>
